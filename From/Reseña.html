<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    textarea {
      width: 80%;
      height: 200px;
      padding: 10px;
      font-size: 16px;
    }
    .boton-volver {
      display: inline-block;
      margin-top: 20px;
      background-color: pink;
      color: black;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
    .boton-volver:hover {
      background-color: hotpink;
      color: white;
    }
  </style>
</head>
<body>

  <h2>Escriba su Reseña</h2>
  <textarea placeholder="Escribe aquí..."></textarea>
  <br>
  <a href="index.html" class="boton-volver">Guardar</a>

</body>
</html>
